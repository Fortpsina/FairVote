[pytest]
testpaths = tests
addopts = -q --strict-markers
filterwarnings =
    error::DeprecationWarning:fairvote.*
    ; wtforms 3.3 still accepts (value, label) tuples; migrating to SelectChoice is
    ; cosmetic and would pin us to a 3.3+ API for no security benefit.
    ignore:Passing SelectField choices as tuples is deprecated:DeprecationWarning:wtforms
